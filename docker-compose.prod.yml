# docker-compose.prod.yml
#
# Production overlay. Combine with the base file. Because cloudflared
# is gated behind the `public` profile in the base, you MUST pass
# `--profile public` explicitly — override files cannot un-gate a
# profile (that's a compose-spec limitation, not a bug here).
#
#   docker compose --profile public \
#     -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# What this changes vs. the base:
#   - postgres: host port 5432 removed — DB is only reachable from the
#     compose network, never from the public internet. Connect via
#     `docker compose exec postgres psql ...` when needed.
#   - server: host port 2222 removed — SSH reaches the server container
#     via the cloudflared tunnel only. No direct LAN/WAN port binding.
#   - pgadmin: not started (no override = stays gated by its `tools`
#     profile in the base file).
#
# Requires: CLOUDFLARE_TUNNEL_TOKEN and DB_PASSWORD set in .env.

services:
  postgres:
    ports: !reset []

  server:
    ports: !reset []
