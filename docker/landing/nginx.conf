# Nginx config fronted by the Cloudflare tunnel. Terminates plain HTTP
# inside the compose network — Cloudflare handles TLS at the edge.

# WebSocket upgrade mapping. $connection_upgrade is "upgrade" when the
# client sent an Upgrade: websocket header, otherwise "close". ttyd's
# terminal protocol runs over WS, so the /play/ proxy below copies
# these into the upstream request.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    # Give Cloudflare's real client IP through to the logs via
    # CF-Connecting-IP. Matters more for abuse mitigation than for
    # anything gameplay-visible.
    real_ip_header   CF-Connecting-IP;
    real_ip_recursive on;
    # Trust Cloudflare's IPv4 ranges (https://www.cloudflare.com/ips-v4)
    # so the real-IP rewrite happens only for tunnel-sourced requests.
    # We don't list IPv6 because the tunnel connects via v4 egress,
    # but adding the v6 block here would be safe.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;

    # Security headers. CSP intentionally permissive for the landing
    # page since the only inline JS is our tiny stats fetcher and the
    # only external endpoint is same-origin /stats. If we ever add
    # third-party widgets, tighten here.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Static landing page. The tiny footprint (one HTML, inline CSS/JS)
    # means gzip + caching aren't worth the config complexity here —
    # Cloudflare's edge compresses on the way out anyway.
    root /usr/share/nginx/html;
    index index.html;

    # /play/  →  ttyd. Ships the xterm.js terminal bundle (HTML, JS,
    # fonts) plus the WebSocket that carries actual terminal I/O.
    # ttyd is configured with --base-path /play so relative URLs
    # inside its HTML already point at /play/..., which keeps this
    # proxy block dumb.
    location /play/ {
        proxy_pass http://webterm:7681/play/;
        proxy_http_version 1.1;
        # WebSocket upgrade: required for the terminal data channel.
        # The xterm.js bundle ships over regular HTTP, but the
        # character stream and resize events are WS frames.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long timeouts for idle WebSocket (a player might leave the
        # tab open while AFK). 1 hour matches typical game session
        # length; above that, the client can just reload.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Nginx default 64k buffer is fine for HTML; disable it for
        # the WS channel so terminal updates don't sit in a queue.
        proxy_buffering off;
    }
    # Redirect /play (no trailing slash) to /play/ so ttyd's asset
    # paths resolve correctly. Without this, hitting /play 302s to
    # /play/?arg=foo which sometimes loses query args; safer as a
    # permanent redirect.
    location = /play { return 301 /play/; }

    # /stats → game server's /health endpoint. Proxied (rather than
    # called directly from the browser via tvweb.toconnect.me)
    # because same-origin avoids CORS preflights and keeps the JSON
    # response fast. The game exposes /health with no auth.
    location = /stats {
        proxy_pass http://server:8080/health;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        # Tiny response; always allow through with short TTL.
        add_header Cache-Control "public, max-age=10";
    }

    # Everything else → static files, with /index.html default.
    location / {
        try_files $uri $uri/ =404;
    }
}
