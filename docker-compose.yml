version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: terminal-velocity-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: terminal_velocity
      POSTGRES_USER: terminal_velocity
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_in_production}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    networks:
      - terminal-velocity-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terminal_velocity -d terminal_velocity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Terminal Velocity Server
  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
    container_name: terminal-velocity-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: terminal_velocity
      DB_USER: terminal_velocity
      DB_PASSWORD: ${DB_PASSWORD:-changeme_in_production}

      # Server configuration
      SSH_PORT: 2222
      MAX_PLAYERS: ${MAX_PLAYERS:-100}

      # Game configuration
      UNIVERSE_SEED: ${UNIVERSE_SEED:-0}
      NUM_SYSTEMS: ${NUM_SYSTEMS:-100}
    ports:
      - "2222:2222"
    volumes:
      - ./configs:/app/configs:ro
      - server_logs:/app/logs
      - server_data:/app/data
    networks:
      - terminal-velocity-net
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2222"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Web-terminal bridge. Serves a browser-based xterm.js UI that
  # auto-spawns an SSH connection to the game server on every page
  # load. Let players connect from any browser without installing
  # cloudflared or an SSH client.
  #
  # Behind the tunnel, cloudflared routes the public hostname (e.g.
  # tv.toconnect.me) to http://webterm:7681. ttyd handles the
  # WebSocket upgrade; openssh-client inside the image runs the
  # actual SSH session to the game container.
  #
  # --writable:   allow browser keystrokes through (otherwise readonly)
  # --max-clients 100: DoS ceiling; game itself has per-IP rate limits
  # ssh options:  skip host-key prompts since the game's SSH auth is
  #               anonymous (real auth is in the app's login screen)
  webterm:
    build:
      context: ./docker/webterm
      dockerfile: Dockerfile
    container_name: terminal-velocity-webterm
    restart: unless-stopped
    profiles:
      - public
    depends_on:
      server:
        condition: service_healthy
    # Client options (-t) tune xterm.js for the BubbleTea TUI:
    #   fontFamily: force a font that has full U+2500 box-drawing
    #     coverage at strict 1-cell width. Browsers vary wildly on
    #     fallback behavior with generic "monospace" and mis-render
    #     heavy-line borders (┃ ┏ ┓), pushing columns out of
    #     alignment one pixel per row.
    #   fontSize:   readable default on modern displays.
    #   rendererType: 'canvas' >> 'dom' for character grid stability,
    #     especially with wide/full-block Unicode.
    #   disableLeaveAlert: don't prompt "are you sure you want to
    #     leave?" on tab close — feels like a popup virus on first
    #     load.
    # `-T xterm-256color` is already the ttyd default but explicit
    # for clarity; the game reads $TERM and colors accordingly.
    command: >
      ttyd
      --writable
      --port 7681
      --max-clients 100
      --base-path /play
      -t fontFamily='"JetBrainsMonoWeb","JetBrains Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace'
      -t fontSize=14
      -t rendererType=canvas
      -t disableLeaveAlert=true
      -T xterm-256color
      ssh
      -tt
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
      -o LogLevel=ERROR
      -o ServerAliveInterval=30
      -p 2222
      guest@server
    networks:
      - terminal-velocity-net

  # Landing page + reverse proxy. nginx serves a static HTML landing
  # at /, proxies /play/ to the webterm container (with WebSocket
  # upgrade headers), and proxies /stats to the game server's
  # /health endpoint for live player counts on the landing page.
  #
  # Cloudflare tunnel should target http://landing:80 for the public
  # hostname (instead of the webterm directly), so visitors get the
  # marketing page first and choose to launch the terminal.
  landing:
    build:
      context: ./docker/landing
      dockerfile: Dockerfile
    container_name: terminal-velocity-landing
    restart: unless-stopped
    profiles:
      - public
    depends_on:
      server:
        condition: service_healthy
      webterm:
        condition: service_started
    networks:
      - terminal-velocity-net

  # Cloudflare Tunnel (Optional — public access via tv.toconnect.me)
  #
  # Enable by setting CLOUDFLARE_TUNNEL_TOKEN in your .env (not committed).
  # The tunnel's public-hostname configuration (in the Cloudflare dashboard)
  # should target `ssh://server:2222` — the `server` DNS name resolves on the
  # shared compose network, so host port 2222 can stay unexposed.
  #
  # Disabled by default via the `public` profile; run with:
  #   docker compose --profile public up -d
  # or enable permanently via docker-compose.prod.yml override.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: terminal-velocity-tunnel
    restart: unless-stopped
    profiles:
      - public
    depends_on:
      server:
        condition: service_healthy
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - terminal-velocity-net

  # PgAdmin (Optional - for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: terminal-velocity-pgadmin
    restart: unless-stopped
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@terminal-velocity.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - terminal-velocity-net
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
  server_logs:
    driver: local
  server_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  terminal-velocity-net:
    driver: bridge
