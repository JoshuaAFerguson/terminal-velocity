# Terminal Velocity Server Configuration

server:
  host: "0.0.0.0"
  port: 2222
  max_players: 100
  tick_rate: 10  # Game loop updates per second

database:
  # PostgreSQL connection parameters.
  #
  # Resolution order at startup (highest precedence first):
  #   1. Fields set in this YAML (if non-empty/non-zero)
  #   2. DB_HOST / DB_PORT / DB_USER / DB_PASSWORD / DB_NAME / DB_SSLMODE env vars
  #   3. Hard-coded defaults (localhost, 5432, terminal_velocity, empty password)
  #
  # Leaving `password` unset here and supplying it via DB_PASSWORD is the
  # recommended deployment posture so secrets don't live in the config file.
  host: "localhost"
  port: 5432
  user: "terminal_velocity"
  password: "changeme"
  database: "terminal_velocity"
  sslmode: "disable"
  # Pool sizing maps to Config.MaxOpenConns / MaxIdleConns on the Go side.
  max_open_conns: 25
  max_idle_conns: 5

security:
  # SSH host key path (will be generated if not exists)
  # Note: In Docker, use data/ instead of configs/ as configs is read-only
  host_key_path: "data/ssh_host_key"

  # Password hashing
  bcrypt_cost: 10

  # Session timeout (minutes)
  session_timeout: 60

game:
  # Universe generation settings
  num_systems: 100
  starting_credits: 10000
  starting_ship: "shuttle"

  # Economy
  market_update_interval: 300  # seconds
  price_volatility: 0.2

  # Combat
  enable_pvp: true
  safe_zone_radius: 2  # Systems around capitals

  # Factions
  faction_creation_cost: 100000
  min_combat_rating_for_faction: 3
  default_member_limit: 10

logging:
  level: "info"  # debug, info, warn, error
  file: "logs/server.log"
  max_size_mb: 100
  max_backups: 3
